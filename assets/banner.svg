<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#0c0d34" />
      <stop offset="100%" stop-color="#18072b" />
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Source/Target gradients -->
    <linearGradient id="source-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>
    
    <linearGradient id="target-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="dest-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.8" />
    </linearGradient>

    <!-- Flow line gradients -->
    <linearGradient id="flow-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#11998e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>
    
    <linearGradient id="flow-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a18cd1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="flow-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#f857a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff5858" stop-opacity="0.2" />
    </linearGradient>

    <!-- Font Family styling -->
    <style>
      .title-text {
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        font-size: 52px;
        letter-spacing: 2px;
      }
      .subtitle-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 400;
        fill: #a0aec0;
        font-size: 18px;
        letter-spacing: 4px;
      }
      .math-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        fill: #38ef7d;
        opacity: 0.85;
      }
      .node-label {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        fill: #718096;
        font-weight: 600;
      }
      .glow-element {
        filter: url(#glow);
      }
      .glow-subtle-element {
        filter: url(#glow-subtle);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid decoration pattern in background -->
  <g opacity="0.08">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Source Distribution Curve (Left side) -->
  <g transform="translate(100, 240)">
    <!-- Filled shape underneath -->
    <path d="M 0,80 Q 40,-40 80,-10 Q 120,50 160,-60 Q 200,-120 240,-10 Q 280,70 320,80 Z" fill="url(#source-grad)" opacity="0.3"/>
    <!-- The curve line -->
    <path d="M 0,80 Q 40,-40 80,-10 Q 120,50 160,-60 Q 200,-120 240,-10 Q 280,70 320,80" fill="none" stroke="#00f2fe" stroke-width="3" class="glow-subtle-element" />
    <text x="120" y="110" class="node-label">Source Distribution μ</text>
  </g>

  <!-- Destination Distribution Curve (Right side) -->
  <g transform="translate(780, 240)">
    <!-- Filled shape underneath -->
    <path d="M 0,80 Q 40,30 80,-90 Q 120,-150 160,-20 Q 200,40 240,-50 Q 280,-100 320,80 Z" fill="url(#dest-grad)" opacity="0.3"/>
    <!-- The curve line -->
    <path d="M 0,80 Q 40,30 80,-90 Q 120,-150 160,-20 Q 200,40 240,-50 Q 280,-100 320,80" fill="none" stroke="#ff0844" stroke-width="3" class="glow-subtle-element" />
    <text x="120" y="110" class="node-label">Target Distribution ν</text>
  </g>

  <!-- Flow / Optimal Transport lines connecting source to target -->
  <!-- We define precise paths for the particles to travel along -->
  <path id="flow-path-1" d="M 300, 180 Q 550, 80 880, 150" fill="none" stroke="url(#flow-grad-1)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <path id="flow-path-2" d="M 340, 230 Q 600, 150 940, 220" fill="none" stroke="url(#flow-grad-2)" stroke-width="3" opacity="0.7"/>
  <path id="flow-path-3" d="M 260, 250 Q 580, 320 1020, 190" fill="none" stroke="url(#flow-grad-3)" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Animated glowing particles moving along the transport paths -->
  <circle r="6" fill="#00f2fe" class="glow-element">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 300, 180 Q 550, 80 880, 150" />
  </circle>
  <circle r="8" fill="#fbc2eb" class="glow-element">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M 340, 230 Q 600, 150 940, 220" />
  </circle>
  <circle r="5" fill="#ff5858" class="glow-element">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 260, 250 Q 580, 320 1020, 190" />
  </circle>

  <!-- Central Title & branding -->
  <g transform="translate(600, 80)" text-anchor="middle">
    <!-- Glowing text behind -->
    <text x="0" y="0" class="title-text glow-element" opacity="0.7" fill="#00f2fe">AWESOME SINKHORN</text>
    <!-- Sharp text in front -->
    <text x="0" y="0" class="title-text">AWESOME SINKHORN</text>
    <text x="0" y="32" class="subtitle-text">OPTIMAL TRANSPORT &amp; MATRIX SCALING</text>
  </g>

  <!-- Mathematical Formula Overlay (Floating & Pulsing) -->
  <g transform="translate(600, 170)" text-anchor="middle">
    <rect x="-240" y="-22" width="480" height="38" rx="8" fill="#0a051b" stroke="#38ef7d" stroke-width="1" opacity="0.8" class="glow-subtle-element"/>
    <text x="0" y="2" class="math-text">W_γ(r, c) = min_{π ∈ U(r, c)} ⟨π, C⟩ - γ H(π)</text>
    <animate attributeName="opacity" values="0.7;1.0;0.7" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- Tiny floating nodes in background -->
  <g opacity="0.6">
    <!-- Node A -->
    <circle cx="200" cy="80" r="4" fill="#00f2fe" class="glow-subtle-element">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Node B -->
    <circle cx="1020" cy="70" r="5" fill="#ff0844" class="glow-subtle-element">
      <animate attributeName="r" values="5;3;5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node C -->
    <circle cx="500" cy="330" r="3" fill="#38ef7d" class="glow-subtle-element">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
